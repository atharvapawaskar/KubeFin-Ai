apiVersion: v1
kind: Service
metadata:
  name: kubefin-gateway
  labels:
    app.kubernetes.io/name: kubefin-gateway
    app.kubernetes.io/part-of: kubefin
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "3000"
    prometheus.io/scheme: "http"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubefin-gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
