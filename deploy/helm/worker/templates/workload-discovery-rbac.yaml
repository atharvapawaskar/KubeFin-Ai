{{- if .Values.kubernetesDiscovery.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubefin-worker.fullname" . }}-workload-discovery
  labels:
    {{- include "kubefin-worker.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubefin-worker.fullname" . }}-workload-discovery
  labels:
    {{- include "kubefin-worker.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubefin-worker.fullname" . }}-workload-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "kubefin-worker.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
